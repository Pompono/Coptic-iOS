name: Build unsigned iPhone IPA

on:
  push:
    branches:
      - feat/progress-protection-backup
    paths:
      - '.github/workflows/unsigned-device-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-iphone:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Build unsigned iOS device application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/device-build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/App.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/CoptLingo-PR5-unsigned.ipa" Payload
          unzip -tq "$GITHUB_WORKSPACE/CoptLingo-PR5-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: CoptLingo-PR5-unsigned-ipa
          path: CoptLingo-PR5-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
