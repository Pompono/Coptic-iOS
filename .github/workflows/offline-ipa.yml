# Historical filename retained so existing workflow links remain valid.
name: Build hosted translation IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
      - run: npm run test:translation-assets
      - run: npx playwright install webkit
      - run: npm run test:mobile
        env:
          COPTIC_BROWSER: webkit
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS' -archivePath /tmp/Coptic.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Package unsigned device IPA
        run: |
          mkdir -p /tmp/coptic-ipa/Payload
          cp -R /tmp/Coptic.xcarchive/Products/Applications/App.app /tmp/coptic-ipa/Payload/
          cd /tmp/coptic-ipa
          zip -qr /tmp/Coptic-hosted-unsigned.ipa Payload
      - name: Verify offline OCR/content, absence of inference and private credentials
        run: python3 scripts/scanner/verify-ipa.py /tmp/Coptic-hosted-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Coptic-hosted-unsigned-IPA
          path: /tmp/Coptic-hosted-unsigned.ipa
          retention-days: 7
