name: Validate mobile app
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.test_supabase_url || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://vprlahihwqtkmhgxytiy.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.test_supabase_publishable_key || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_supabase_url:
        description: Optional approved staging Supabase URL for a disposable-account test IPA
        required: false
        type: string
      test_supabase_publishable_key:
        description: Staging PUBLIC publishable key only (never a service-role or secret key)
        required: false
        type: string
# Push and pull_request events for the same branch share one validation run.
concurrency:
  group: mobile-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  schema-replay-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Harness validation only. No production schema export is in this repo.
      - run: >-
          python3 scripts/account-deletion-schema-replay.py --synthetic
          --schema supabase/tests/account_deletion_expanded_fixture.sql
          --test supabase/tests/account_deletion_nullable_after.sql
          --test supabase/tests/account_deletion_expanded.sql
          --test supabase/tests/account_deletion_permissions.sql
          --test supabase/tests/account_deletion_rls.sql
      - name: Show synthetic harness diagnostics on failure
        if: failure()
        # This job accepts only checked-in synthetic inputs, never private DDL.
        run: |
          for file in .private-schema-audit/*/failure.log; do
            if [ -f "$file" ]; then cat "$file"; fi
          done
  progress-sync-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coptic_progress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coptic_progress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create disposable Supabase auth fixtures
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA storage;
          CREATE TABLE storage.objects (bucket_id text, name text, owner uuid, owner_id text);
          CREATE TABLE storage.buckets (id text, owner uuid, owner_id text);
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          ALTER TABLE storage.buckets ENABLE ROW LEVEL SECURITY;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT nullif(current_setting('request.jwt.claims', true)::jsonb ->> 'sub', '')::uuid $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated;
          SQL
      - name: Apply original progress snapshot migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261019000000_progress_sync.sql
      - name: Reproduce the original RPC validation rejections
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/progress_sync_rpc_legacy_rejections.sql
      - name: Apply additive progress RPC compatibility migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000000_progress_sync_rpc_compat.sql
      - name: Exercise authenticated snapshot RPC with realistic records
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/progress_sync_rpc.sql
      - name: Apply and test account deletion guards in disposable PostgreSQL only
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261026000000_account_deletion.sql
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion.sql
          # Verify the original staging shape still works, without retaining this application.
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -c 'begin' -f supabase/migrations/20261027000000_account_deletion_production_schema.sql -f supabase/migrations/20261027120000_account_deletion_required_ownership.sql -c "do \$\$ begin if not public.account_deletion_ready() then raise exception 'Original staging schema rejected'; end if; end \$\$;" -f supabase/tests/account_deletion.sql -c 'rollback'
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_expanded_fixture.sql
          # Model a stale inventory without modifying any live data.
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -c "insert into public.xp_events(payload) values ('preexisting-unowned')"
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261027000000_account_deletion_production_schema.sql
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_nullable_before.sql
          if psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261027120000_account_deletion_required_ownership.sql; then
            echo "Unsafe migration accepted pre-existing unowned data"; exit 1
          fi
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_nullable_rejected.sql
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261027120000_account_deletion_required_ownership.sql
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_nullable_after.sql
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_expanded.sql
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_permissions.sql
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_rls.sql
          python3 scripts/account-deletion-postgres-races.py
  deletion-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/account-deletion/index.ts
  deletion-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase (never linked to a remote project)
        # Supabase startup output contains local test credentials. Keep it out of CI logs.
        run: |
          # Synthetic pre-existing production-shaped tables exist ONLY in this disposable runner.
          cp supabase/tests/account_deletion_expanded_fixture.sql supabase/migrations/20261026120000_disposable_fixture.sql
          supabase start > /tmp/coptic-supabase-start.log 2>&1 || { echo "Local Supabase startup failed; credential-bearing output was not logged."; exit 1; }
      - name: Allow isolated fixture uploads
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_permissions.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL'
          create policy disposable_test_upload on storage.objects for insert to authenticated with check (owner_id = auth.uid()::text);
          SQL
      - name: Serve deletion function locally and test disposable users only
        run: |
          supabase status -o env > /tmp/coptic-local-supabase.env
          printf 'ACCOUNT_DELETION_ENABLED=true\nACCOUNT_DELETION_ALLOWED_ORIGINS=capacitor://localhost\n' > /tmp/coptic-deletion-function.env
          supabase functions serve account-deletion --env-file /tmp/coptic-deletion-function.env > /tmp/coptic-deletion-function.log 2>&1 &
          set -a
          source /tmp/coptic-local-supabase.env
          set +a
          for i in $(seq 1 30); do
            if curl --silent --fail "$API_URL/functions/v1/account-deletion" -H 'Content-Type: application/json' -d '{"action":"ready"}' > /dev/null; then break; fi
            sleep 2
          done
          node scripts/account-deletion-integration.mjs
      - if: always()
        run: supabase stop --no-backup
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run lint
      - run: npm run build
      - run: npm run test:translation-assets
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:mobile
      - run: npm run test:mobile
        env:
          COPTIC_BROWSER: webkit
      - run: node scripts/account-deletion-smoke.mjs
        if: ${{ !cancelled() }}
      - run: node scripts/account-deletion-smoke.mjs
        if: ${{ !cancelled() }}
        env:
          DELETION_BROWSER: webkit
      - run: npm run test:routes
        env:
          ROUTE_ARTIFACTS: .codex-temp/route-preparation/chromium
      - run: npm run test:routes
        env:
          ROUTE_BROWSER: webkit
          ROUTE_ARTIFACTS: .codex-temp/route-preparation/webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-route-navigation-video-and-frames
          path: .codex-temp/route-preparation
          retention-days: 30
      - run: node scripts/settings-redesign-smoke.mjs
      - run: npm run test:settings-navigation
        env:
          SETTINGS_NAV_ARTIFACTS: .codex-temp/settings-navigation/chromium
          SETTINGS_EXPECT_AUTH: '1'
      - run: npm run test:settings-navigation
        env:
          SETTINGS_BROWSER: webkit
          SETTINGS_NAV_ARTIFACTS: .codex-temp/settings-navigation/webkit
          SETTINGS_EXPECT_AUTH: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-navigation-video-and-frames
          path: .codex-temp/settings-navigation
          if-no-files-found: warn
          retention-days: 30
      - run: npm run test:backup
      - run: node scripts/build-native-backup-smoke.mjs && node scripts/native-fixture-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-web-app
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: settings-redesign-screenshots
          path: docs/settings-screenshots
          if-no-files-found: error
          retention-days: 30
  ios:
    # A simulator compile verifies the native project without signing secrets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - run: node scripts/build-native-backup-smoke.mjs
      - run: cp scripts/native-backup-smoke.js ios/App/App/public/native-backup-smoke.js
      - run: python3 scripts/build-native-simulator.py
      - run: python3 scripts/verify-native-backup.py /tmp/coptic-derived/Build/Products/Debug-iphonesimulator/App.app
      - run: bash scripts/native-startup-smoke.sh 2>&1 | tee /tmp/coptic-native-startup.log
        # Explicit bash enables pipefail so tee cannot hide a simulator failure.
        shell: bash
        id: native_startup
        timeout-minutes: 22
      - run: rm ios/App/App/public/native-backup-smoke.js ios/App/App/public/native-backup-api.js
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -derivedDataPath /tmp/coptic-iphone-derived CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir -p /tmp/coptic-ipa/Payload
          cp -R /tmp/coptic-iphone-derived/Build/Products/Release-iphoneos/App.app /tmp/coptic-ipa/Payload/App.app
          (cd /tmp/coptic-ipa && /usr/bin/zip -qr /tmp/CoptLingo-unsigned.ipa Payload)
      - run: python3 scripts/scanner/verify-ipa.py /tmp/CoptLingo-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CoptLingo-unsigned-iphone-ipa
          path: /tmp/CoptLingo-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure() && steps.native_startup.outcome == 'failure'
        with:
          name: native-startup-diagnostics
          path: |
            /tmp/coptic-native-stdout.log
            /tmp/coptic-native-stderr.log
            /tmp/coptic-native-boot.log
            /tmp/coptic-native-startup.log
            /tmp/coptic-native-system.log
          if-no-files-found: warn
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
