name: Validate mobile app
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://vprlahihwqtkmhgxytiy.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
on:
  push:
  pull_request:
  workflow_dispatch:
# Push and pull_request events for the same branch share one validation run.
concurrency:
  group: mobile-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  progress-sync-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coptic_progress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coptic_progress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create disposable Supabase auth fixtures
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT nullif(current_setting('request.jwt.claims', true)::jsonb ->> 'sub', '')::uuid $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated;
          SQL
      - name: Apply original progress snapshot migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261019000000_progress_sync.sql
      - name: Reproduce the original RPC validation rejections
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/progress_sync_rpc_legacy_rejections.sql
      - name: Apply additive progress RPC compatibility migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000000_progress_sync_rpc_compat.sql
      - name: Exercise authenticated snapshot RPC with realistic records
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/coptic_progress_test" -v ON_ERROR_STOP=1 -f supabase/tests/progress_sync_rpc.sql
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run lint
      - run: npm run build
      - run: npm run test:translation-assets
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:mobile
      - run: npm run test:routes
        env:
          ROUTE_ARTIFACTS: .codex-temp/route-preparation/chromium
      - run: npm run test:routes
        env:
          ROUTE_BROWSER: webkit
          ROUTE_ARTIFACTS: .codex-temp/route-preparation/webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-route-navigation-video-and-frames
          path: .codex-temp/route-preparation
          retention-days: 30
      - run: node scripts/settings-redesign-smoke.mjs
      - run: npm run test:settings-navigation
        env:
          SETTINGS_NAV_ARTIFACTS: .codex-temp/settings-navigation/chromium
          SETTINGS_EXPECT_AUTH: '1'
      - run: npm run test:settings-navigation
        env:
          SETTINGS_BROWSER: webkit
          SETTINGS_NAV_ARTIFACTS: .codex-temp/settings-navigation/webkit
          SETTINGS_EXPECT_AUTH: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-navigation-video-and-frames
          path: .codex-temp/settings-navigation
          if-no-files-found: warn
          retention-days: 30
      - run: npm run test:backup
      - run: node scripts/build-native-backup-smoke.mjs && node scripts/native-fixture-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-web-app
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: settings-redesign-screenshots
          path: docs/settings-screenshots
          if-no-files-found: error
          retention-days: 30
  ios:
    # A simulator compile verifies the native project without signing secrets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - run: node scripts/build-native-backup-smoke.mjs
      - run: cp scripts/native-backup-smoke.js ios/App/App/public/native-backup-smoke.js
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/coptic-derived CODE_SIGNING_ALLOWED=NO build
      - run: python3 scripts/sign-native-smoke.py /tmp/coptic-derived/Build/Products/Debug-iphonesimulator/App.app
      - run: python3 scripts/verify-native-backup.py /tmp/coptic-derived/Build/Products/Debug-iphonesimulator/App.app
      - run: bash scripts/native-startup-smoke.sh 2>&1 | tee /tmp/coptic-native-startup.log
        # Explicit bash enables pipefail so tee cannot hide a simulator failure.
        shell: bash
        id: native_startup
        timeout-minutes: 22
      - run: rm ios/App/App/public/native-backup-smoke.js ios/App/App/public/native-backup-api.js
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -derivedDataPath /tmp/coptic-iphone-derived CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir -p /tmp/coptic-ipa/Payload
          cp -R /tmp/coptic-iphone-derived/Build/Products/Release-iphoneos/App.app /tmp/coptic-ipa/Payload/App.app
          (cd /tmp/coptic-ipa && /usr/bin/zip -qr /tmp/CoptLingo-unsigned.ipa Payload)
      - run: python3 scripts/scanner/verify-ipa.py /tmp/CoptLingo-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CoptLingo-unsigned-iphone-ipa
          path: /tmp/CoptLingo-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure() && steps.native_startup.outcome == 'failure'
        with:
          name: native-startup-diagnostics
          path: |
            /tmp/coptic-native-stdout.log
            /tmp/coptic-native-stderr.log
            /tmp/coptic-native-boot.log
            /tmp/coptic-native-startup.log
            /tmp/coptic-native-system.log
          if-no-files-found: warn
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
