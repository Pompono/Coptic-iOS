name: Validate mobile app
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:translation-assets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-web-app
          path: out
  ios:
    # A simulator compile verifies the native project without signing secrets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/coptic-derived CODE_SIGNING_ALLOWED=NO build
      - run: bash scripts/native-startup-smoke.sh 2>&1 | tee /tmp/coptic-native-startup.log
        id: native_startup
        timeout-minutes: 18
      - uses: actions/upload-artifact@v4
        if: failure() && steps.native_startup.outcome == 'failure'
        with:
          name: native-startup-diagnostics
          path: |
            /tmp/coptic-native-stdout.log
            /tmp/coptic-native-stderr.log
            /tmp/coptic-native-boot.log
            /tmp/coptic-native-startup.log
          if-no-files-found: warn
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
